#
# Build, test and lint the plugin on Arch Linux (the reference platform).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Arch Linux Archive snapshot. Pinned together with the container digests below to make CI
  # reproducible: the digest fixes the base image, this fixes the package versions. Bump both
  # in the same commit when refreshing.
  ARCHIVE_DATE: "2026/10/07"

jobs:
  build-and-test:
    name: Build & test (KF6)
    runs-on: ubuntu-latest
    container: archlinux@sha256:2fd1ae548076c67bcd41098ddd44e799058010e8d55f085d453dbb890e706860
    steps:
      - name: Pin the package snapshot
        run: printf 'Server = https://archive.archlinux.org/repos/%s/$repo/os/$arch\n' "$ARCHIVE_DATE" > /etc/pacman.d/mirrorlist
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake ninja git \
            qt6-base krunner kcoreaddons ki18n knotifications kconfig \
            extra-cmake-modules
      - uses: actions/checkout@v7
      - name: Mark the workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Configure, build and test
        run: cmake --workflow --preset user

  lint:
    name: Lint
    runs-on: ubuntu-latest
    container: archlinux@sha256:2fd1ae548076c67bcd41098ddd44e799058010e8d55f085d453dbb890e706860
    steps:
      - name: Pin the package snapshot
        run: printf 'Server = https://archive.archlinux.org/repos/%s/$repo/os/$arch\n' "$ARCHIVE_DATE" > /etc/pacman.d/mirrorlist
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed \
            git clang typos shellcheck yamllint editorconfig-checker
      - uses: actions/checkout@v7
      - name: Mark the workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: clang-format
        run: |
          files=$(git ls-files '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' '*.hxx')
          [ -z "$files" ] || clang-format --dry-run --Werror $files
      - name: typos
        run: typos .
      - name: shellcheck
        run: |
          files=$(git ls-files '*.sh' '*.bash')
          [ -z "$files" ] || shellcheck $files
      - name: yamllint
        run: yamllint .
      - name: editorconfig
        run: editorconfig-checker
