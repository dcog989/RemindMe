#
# cocogitto configuration: Conventional Commits, changelog and version bumps.
# Commit messages are checked by the lefthook `commit-msg` hook; releases are
# cut with `cog bump`.

from_latest_tag = false
ignore_merge_commits = true
ignore_fixup_commits = true
disable_changelog = false
disable_bump_commit = false
branch_whitelist = ["main"]
skip_ci = "[skip ci]"
skip_untracked = false
tag_prefix = "v"

# {{version}} is the target version. Keep project() the single source of truth: bump it here so
# the generated runner metadata (data/plasma-runner-remindme.desktop) follows automatically, then
# build and test that exact version. Sync first so the release commit is built on the current
# remote tip and the post-bump push is a fast-forward.
pre_bump_hooks = [
    "git pull --rebase --autostash origin main",
    'sed -i -E "s/^project\(remindme VERSION [0-9.]+/project(remindme VERSION {{version}}/" CMakeLists.txt',
    "cmake --workflow --preset user",
]
# Build the store payload, push the branch and tag and open the GitHub release in one go.
# The KDE Store upload has no CLI and stays manual.
post_bump_hooks = ["bash packaging/release.sh"]

[commit_types]
feat = { changelog_title = "Features" }
fix = { changelog_title = "Bug Fixes" }
perf = { changelog_title = "Performance" }
refactor = { changelog_title = "Refactoring" }
docs = { changelog_title = "Documentation" }
build = { changelog_title = "Build" }
ci = { changelog_title = "CI" }
test = { changelog_title = "Tests" }
style = { changelog_title = "Style", omit_from_changelog = true }
chore = { changelog_title = "Chores", omit_from_changelog = true }
revert = { changelog_title = "Reverts" }

[changelog]
path = "CHANGELOG.md"
